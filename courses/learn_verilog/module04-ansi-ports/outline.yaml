title: ANSI vs non-ANSI ports
footer: learn_verilog — ansi ports
slides:
- type: title
  title: ANSI vs non-ANSI ports
  subtitle: You have seen module boundaries and port directions, now the question
    is where those directions are written
  notes: 'You have seen module boundaries and port directions—now the question is
    where those directions are written. Verilog-1995 lists port names in the header
    and declares input or output inside the module body. Verilog-2001 ANSI style puts
    direction, type, and width right in the port list. This module is that style split:
    same hardware, two header conventions.'
- type: bullets
  title: Two header styles
  bullets:
  - In non-ANSI style
  - In ANSI style, the header carries the full picture
  - For a clocked output you might write output reg q in ANSI
  - Bus widths and parameters follow the same pattern
  notes: 'In non-ANSI style, the module line might read module and-two open-paren
    a, b, y close-paren semicolon, then input a and b and output y appear as separate
    lines in the body. In ANSI style, the header carries the full picture: input wire
    a, input wire b, output wire y. For a clocked output you might write output reg
    q in ANSI, while non-ANSI often says output q semicolon then reg q semicolon on
    the next lines. Bus widths and parameters follow the same pattern—the information
    moves from body to header, not the function.'
- type: image
  title: Browser lab
  image: assets/lab-starter.png
  caption: ANSI ports lab starter
  notes: In the browser lab track, open the ANSI versus non-ANSI ports lab from the
    tools page. You will see challenges at the top, variant presets in the middle,
    and two code columns side by side—nineteen ninety-five on the left, two thousand
    one ANSI on the right. Load the starter example for the combo AND gate and compare
    the headers. Switch to the clocked output reg preset or the eight-bit bus preset
    and watch what moves between columns. Work a few challenges, then use Check when
    the view matches the prompt.
- type: image
  title: Real Verilog practice
  image: assets/real-shell.png
  caption: Real Verilog — ANSI and non-ANSI AND
  notes: "In the real Verilog track, open this module’s examples folder and read the\
    \ paired AND sketches. One module uses the classic name list plus body directions;\
    \ the other uses an ANSI header with wire on the ports. The assign inside is identical.\
    \ If Icarus is available, run a syntax-only compile on the file—both modules can\
    \ live in one file for learning. In new code you will almost always write ANSI\
    \ headers; you still need to read legacy non-ANSI when you inherit older RTL.\n\
    \n```verilog\n// and2_styles.v — same AND, two port-list conventions\nmodule and2_nonansi(a,\
    \ b, y);\n  input  a, b;\n  output y;\n  assign y = a & b;\nendmodule\n\nmodule\
    \ and2_ansi(\n  input  wire a,\n  input  wire b,\n  output wire y\n);\n  assign\
    \ y = a & b;\nendmodule\n\n// iverilog -t null and2_styles.v — syntax check only\n\
    ```"
- type: bullets
  title: Pitfalls to watch
  bullets:
  - Do not assume non-ANSI means wrong, it is still valid IEEE 1364, just older layout
  - Do not forget that output reg in ANSI replaces the separate output and reg lines
    in the
  - Mixing styles in one module is confusing, pick one convention per file
  - And remember
  notes: 'Do not assume non-ANSI means wrong—it is still valid IEEE 1364, just older
    layout. Do not forget that output reg in ANSI replaces the separate output and
    reg lines in the body. Mixing styles in one module is confusing—pick one convention
    per file. And remember: the lab compares syntax only; tri-state inout and parameter
    blocks have their own presets to explore separately.'
