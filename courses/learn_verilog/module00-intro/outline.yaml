title: Welcome to Verilog RTL
footer: learn_verilog — intro
slides:
- type: title
  title: Welcome to Verilog RTL
  subtitle: In digital design you will write register-transfer level code
  notes: In digital design you will write register-transfer level code—the logic that
    describes what your chip or block should do, cycle by cycle. This short clip welcomes
    you to learn Verilog, and shows how the course is meant to be used.
- type: bullets
  title: Why RTL matters
  bullets:
  - Coursework is not only drawing block diagrams
  - You need modules with ports, wires and registers
  - Later labs, counters, shift registers, lint
  - Getting comfortable here pays off in every later design and verification course
  notes: Coursework is not only drawing block diagrams. You need modules with ports,
    wires and registers, and always blocks that synthesize cleanly. Later labs—counters,
    shift registers, lint, and the bridge into finite-state machines—all assume you
    can read and write small Verilog sketches without guessing. Getting comfortable
    here pays off in every later design and verification course.
- type: bullets
  title: Two tracks, one idea
  bullets:
  - Every lab module offers two ways to practice
  - Style rules feel like work you will keep
  - The browser lab track uses interactive tools on the learning platform
  - You may do either track, or both
  - The usual rhythm is browser first for the idea, then a tiny dot-v sketch for muscle
    memory
  notes: Every lab module offers two ways to practice. The real Verilog track uses
    your own editor and optional local simulator, so ports, assignments, and style
    rules feel like work you will keep. The browser lab track uses interactive tools
    on the learning platform, so you can build intuition without installing anything.
    You may do either track, or both. The usual rhythm is browser first for the idea,
    then a tiny dot-v sketch for muscle memory.
- type: bullets
  title: Set up the real Verilog track
  bullets:
  - Open a text editor for dot-v files, VS Code, Cursor, or vim all work
  - Clone or open this course repo and skim the examples folder when a module points
    you there
  - Optionally confirm a simulator is reachable
  - You do not need a full EDA install on day one
  notes: 'Open a text editor for dot-v files—VS Code, Cursor, or vim all work. Clone
    or open this course repo and skim the examples folder when a module points you
    there. Optionally confirm a simulator is reachable: local Icarus with iverilog
    and vvp, or the browser HDL simulator linked from the course README. You do not
    need a full EDA install on day one—a short sketch you can compile or paste is
    enough to start.'
- type: image
  title: Set up the browser lab track
  image: assets/lab-tools-index.png
  caption: Tools index
  notes: From the monorepo, serve the platform folder with a simple local web server,
    then open the tools index in your browser. Serving the folder means your browser
    can load the interactive labs as ordinary web pages. If you prefer, use the published
    tools site instead. Scroll to the Verilog section when you are curious—you will
    meet the module and port diagram lab in the very next module.
- type: bullets
  title: How to move through modules
  bullets:
  - For each module
  - SystemVerilog design constructs and UVM are later courses
  - When you finish this intro checklist, continue to the first lab module
  notes: 'For each module, read the README for the outcome, pick a track—or both—then
    work the checklist. SystemVerilog design constructs and UVM are later courses;
    this path stays in the IEEE 1364 family. When you finish this intro checklist,
    continue to the first lab module: the module and port diagram.'
