title: Counter patterns
footer: learn_verilog — counter lab
slides:
- type: title
  title: Counter patterns
  subtitle: Counters are small sequential machines that change state on each clock
    edge
  notes: Counters are small sequential machines that change state on each clock edge.
    The simplest pattern is an up counter that adds one and wraps when the register
    width overflows. From there you get down counters, modulo counters that wrap at
    a chosen limit, count-enable versions that hold when CE is zero, and Gray counters
    where only one output bit changes per step. This module is that family of patterns
    and when to use each one.
- type: bullets
  title: Count, wrap, or hold
  bullets:
  - A four-bit up counter naturally wraps from fifteen back to zero because the register
    width
  - A down counter subtracts one and wraps under zero back to fifteen
  - A modulo-ten counter checks for nine, then reloads zero on the next edge
  - Count enable is the preferred hold pattern
  - Gray counting is different from plain binary because adjacent codes flip one bit
  notes: 'A four-bit up counter naturally wraps from fifteen back to zero because
    the register width is fixed. A down counter subtracts one and wraps under zero
    back to fifteen. A modulo-ten counter checks for nine, then reloads zero on the
    next edge. Count enable is the preferred hold pattern: if CE is one, increment;
    otherwise keep the old value. Gray counting is different from plain binary because
    adjacent codes flip one bit, which is useful when you care about safer transitions
    between states.'
- type: image
  title: Browser lab
  image: assets/lab-starter.png
  caption: Counter lab starter
  notes: In the browser lab track, open the counter lab from the tools page. The starter
    begins as an up counter at zero, with buttons to step the clock, reset, toggle
    CE, and switch among up, down, modulo, enable, and Gray modes. Step a few cycles
    and watch the binary value, wrap behavior, and changed bits. Then try enable mode
    with CE low so the count holds, and switch to Gray mode to see one-bit transitions.
    Work the challenges, then use Check.
- type: image
  title: Real Verilog practice
  image: assets/real-shell.png
  caption: Real Verilog - up and modulo counters
  notes: "In the real Verilog track, open this module's examples folder. One sketch\
    \ is a four-bit up counter with synchronous reset and count enable. The second\
    \ is a modulo-ten counter that wraps explicitly at nine. If Icarus is available,\
    \ run a syntax-only compile; the goal is recognizing clean sequential counter\
    \ structure with non-blocking updates.\n\n```verilog\n// counter_demo.v - up and\
    \ modulo counters\nmodule up_counter4(\n  input        clk,\n  input        rst,\n\
    \  input        ce,\n  output reg [3:0] q\n);\n  always @(posedge clk) begin\n\
    \    if (rst) q <= 4'd0;\n    else if (ce) q <= q + 4'd1;\n  end\nendmodule\n\n\
    module mod10_counter(\n  input        clk,\n  input        rst,\n  output reg\
    \ [3:0] q\n);\n  always @(posedge clk) begin\n    if (rst) q <= 4'd0;\n    else\
    \ if (q == 4'd9) q <= 4'd0;\n    else q <= q + 4'd1;\n  end\nendmodule\n\n// iverilog\
    \ -t null counter_demo.v - syntax check only\n```"
- type: bullets
  title: Pitfalls to watch
  bullets:
  - Do not use blocking assignment in clocked counter RTL
  - Do not forget the explicit wrap condition for modulo counters that are not powers
    of two
  - Do not implement hold by assigning from multiple drivers
  - Do not confuse Gray count outputs with ordinary binary values
  notes: Do not use blocking assignment in clocked counter RTL. Do not forget the
    explicit wrap condition for modulo counters that are not powers of two. Do not
    implement hold by assigning from multiple drivers; use one always block with a
    CE branch. Do not confuse Gray count outputs with ordinary binary values—the visual
    pattern is different on purpose.
- type: bullets
  title: Your turn
  bullets:
  - Complete the checklist for at least one track, preferably both
  - In the browser, step the modulo mode until it wraps and explain why it returns
    to zero
  - On real Verilog, write an enabled counter that holds when CE is low
  - When you are ready
  notes: Complete the checklist for at least one track—preferably both. In the browser,
    step the modulo mode until it wraps and explain why it returns to zero. On real
