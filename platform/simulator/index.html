<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HDL Simulator — Digital Design and Verification Platform</title>
  <link rel="canonical" href="https://universal-verification-methodology.github.io/systemverilog-simulator/">
  <meta http-equiv="refresh" content="0; url=https://universal-verification-methodology.github.io/systemverilog-simulator/">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site-config.js"></script>
  <script>
    (function () {
      var url = (window.SITE_CONFIG && window.SITE_CONFIG.simulatorUrl) ||
        "https://universal-verification-methodology.github.io/systemverilog-simulator/";
      var link = document.querySelector('link[rel="canonical"]');
      var meta = document.querySelector('meta[http-equiv="refresh"]');
      if (link) link.href = url;
      if (meta) meta.content = "0; url=" + url;
      window.location.replace(url);
    })();
  </script>
</head>
<body data-asset-base="../assets/">
  <main id="main" style="padding: 2rem 1.25rem; max-width: 40rem;">
    <p>Redirecting to <a id="sim-fallback" href="https://universal-verification-methodology.github.io/systemverilog-simulator/">HDL Simulator</a>…</p>
  </main>
  <script>
  (function () {
    var url = (window.SITE_CONFIG && window.SITE_CONFIG.simulatorUrl) ||
      "https://universal-verification-methodology.github.io/systemverilog-simulator/";
    var a = document.getElementById("sim-fallback");
    if (a) a.href = url;
  })();
  </script>
</body>
</html>
